# Symphony - Multi-light choreography demonstration
#
# Each track runs independently in parallel, creating a
# coordinated "symphony of lights" across your space.
#
# Usage: huesignal run examples/symphony.yaml

name: symphony
description: Coordinated multi-light choreography across all lights

tracks:
  # Track 1: PC - The lead performer
  - light: PC
    steps:
      - set:
          on: true
          brightness: 50
          color: blue
          transition_ms: 500
      - wait: 500
      - effect: pulse
        options:
          color: info
          brightness: 254
          count: 2
        duration_ms: 2000
      - wait: 500
      - effect: rainbow
        duration_ms: 4000
      - set:
          brightness: 200
          color: success
          transition_ms: 800

  # Track 2: TV - Following with delay
  - light: TV
    steps:
      - wait: 500  # Start delayed for cascade effect
      - set:
          on: true
          brightness: 80
          color: purple
          transition_ms: 600
      - wait: 600
      - effect: breathe
        options:
          color: magenta
          brightness: 200
        duration_ms: 3000
      - effect: pulse
        options:
          color: cyan
          count: 3
        duration_ms: 2000
      - set:
          brightness: 180
          color: success
          transition_ms: 800

  # Track 3: Spisebord - The ambient backdrop
  - light: Spisebord
    steps:
      - wait: 1000  # Start even later for wave effect
      - set:
          on: true
          brightness: 100
          transition_ms: 800
      - wait: 800
      - effect: breathe
        options:
          brightness: 200
        duration_ms: 4000
      - effect: pulse
        options:
          brightness: 254
          count: 2
        duration_ms: 1500
      - set:
          brightness: 150
          transition_ms: 600

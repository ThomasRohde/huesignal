# Agent Workflow - Complete AI agent visual feedback cycle
#
# A comprehensive visual language for AI coding agents:
# - Task claim → blue pulse
# - Working → subtle blue breathing
# - Progress → color shift toward green
# - Complete → green celebration
#
# This demonstrates the full agent workflow in one sequence.
#
# Usage: huesignal run examples/agent-workflow.yaml

name: agent-workflow
description: Complete AI agent task lifecycle visualization

tracks:
  - light: PC
    steps:
      # Stage 1: Task Claimed - Blue acknowledgment
      - set:
          on: true
          brightness: 150
          color: info
          transition_ms: 300
      - wait: 300
      - effect: pulse
        options:
          color: info
          brightness: 200
          count: 2
        duration_ms: 1000
      
      # Stage 2: Working - Subtle blue breathing
      - effect: breathe
        options:
          color: working
          brightness: 130
        duration_ms: 4000
      
      # Stage 3: Progress - Shift toward cyan (halfway there)
      - set:
          brightness: 160
          color: cyan
          transition_ms: 800
      - wait: 800
      - effect: breathe
        options:
          color: cyan
          brightness: 150
        duration_ms: 3000
      
      # Stage 4: Almost done - Cyan-green transition
      - set:
          brightness: 180
          color: "#20B2AA"
          transition_ms: 600
      - wait: 600
      - effect: pulse
        options:
          color: "#20B2AA"
          count: 1
        duration_ms: 800
      
      # Stage 5: Complete - Green celebration burst
      - effect: pulse
        options:
          color: success
          brightness: 254
          count: 3
        duration_ms: 1500
      
      # Stage 6: Verified - Settle to success glow
      - set:
          brightness: 200
          color: success
          transition_ms: 600
      - wait: 2000
      
      # Stage 7: Ready for next task - Return to neutral
      - set:
          brightness: 120
          color: white
          transition_ms: 1000

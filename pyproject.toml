[project]
name = "huesignal"
version = "0.1.0"
description = "Philips Hue notification system with CLI and daemon"
readme = "PRD.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]",
    "aiohue>=4.7.0",
    "httpx",
    "zeroconf",
    "keyring",
]

[project.scripts]
huesignal = "huesignal.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
